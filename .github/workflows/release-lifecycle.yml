name: Release lifecycle

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "synthetic: CPU verification and the four synthetic scenarios only. release: CPU verification, then provision and run one release on the trusted runner (main only, protected environment)."
        type: choice
        options:
          - synthetic
          - release
        default: synthetic
      release_id:
        description: "release only: the release directory to provision (or reuse) under LIFECYCLE_RELEASE_ROOT"
        type: string
        default: ""
      confirm_live:
        description: "release only: repeat release_id to authorize the paid stage"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cpu:
    name: CPU verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/test-requirements.txt
      - run: python -m unittest discover -s tests/unit -p "test_*.py"
      - run: python -m unittest discover -s tests/ci -p "test_*.py"
      - run: python -m unittest discover -s tests/integration -p "test_*.py"
      - run: python -m unittest discover -s tests/validity -p "test_*.py"

  synthetic:
    name: Synthetic lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - blocked
          - healthy
          - regression
          - production_regression
    env:
      PYTHONPATH: src
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/test-requirements.txt
      - name: Run and verify the synthetic scenario
        run: |
          set +e
          python scripts/demo/run_three_tier_dev.py synthetic --scenario "$SCENARIO" > scenario.json
          code=$?
          set -e
          python scripts/ci/check_synthetic.py --scenario "$SCENARIO" --exit-code "$code" scenario.json

  provision:
    name: Provision release
    needs: [cpu, synthetic]
    if: >-
      github.repository == 'sathviknookala/llm-behavior-ci'
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && vars.LIFECYCLE_RELEASE_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    runs-on: [self-hosted, linux, llm-behavior-ci-release]
    environment: release-provision
    timeout-minutes: 30
    concurrency:
      group: release-lifecycle-provision
      cancel-in-progress: false
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      PYTHONPATH: src
      EVENT_NAME: ${{ github.event_name }}
      INPUT_RELEASE_ID: ${{ inputs.release_id }}
      CONFIRM_LIVE: ${{ inputs.confirm_live }}
      COMMIT: ${{ github.sha }}
      LIFECYCLE_RELEASE_ROOT: ${{ vars.LIFECYCLE_RELEASE_ROOT }}
      LIFECYCLE_RELEASE_SPEC: ${{ vars.LIFECYCLE_RELEASE_SPEC }}
      LIFECYCLE_PYTHON: ${{ vars.LIFECYCLE_PYTHON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the release id
        id: release
        run: bash scripts/ci/resolve_release_id.sh
      - name: Provision the release at this commit
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          test -n "$LIFECYCLE_RELEASE_ROOT"
          test -n "$LIFECYCLE_RELEASE_SPEC"
          test -n "$LIFECYCLE_PYTHON"
          "$LIFECYCLE_PYTHON" scripts/ci/release_ctl.py provision --release-root "$LIFECYCLE_RELEASE_ROOT" --release-id "$RELEASE_ID" --spec "$LIFECYCLE_RELEASE_SPEC" --reuse-existing

  live:
    name: Deploy release (paid)
    needs: provision
    if: >-
      github.repository == 'sathviknookala/llm-behavior-ci'
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && vars.LIFECYCLE_RELEASE_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    runs-on: [self-hosted, linux, llm-behavior-ci-release]
    environment: release-live
    timeout-minutes: 360
    concurrency:
      group: release-lifecycle-live
      cancel-in-progress: false
    env:
      PYTHONPATH: src
      RELEASE_ID: ${{ needs.provision.outputs.release_id }}
      LIFECYCLE_RELEASE_ROOT: ${{ vars.LIFECYCLE_RELEASE_ROOT }}
      LIFECYCLE_PYTHON: ${{ vars.LIFECYCLE_PYTHON }}
    steps:
      - name: Require a provisioned release
        run: |
          test -n "$RELEASE_ID"
          test -n "$LIFECYCLE_RELEASE_ROOT"
          test -n "$LIFECYCLE_PYTHON"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the deployed service against the release lineage
        run: |
          "$LIFECYCLE_PYTHON" scripts/ci/release_ctl.py check-deployed --release-dir "$LIFECYCLE_RELEASE_ROOT/$RELEASE_ID"
      - name: Activate the release service
        run: bash scripts/ci/activate_release.sh
      - name: Run the release lifecycle
        run: bash scripts/ci/run_live_release.sh
