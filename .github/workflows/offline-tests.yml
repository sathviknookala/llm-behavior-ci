name: Offline statistical gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/ci -p "test_*.py"
      - run: python scripts/run_offline_gate.py
